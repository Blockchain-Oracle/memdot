[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# Size over per-call gas: Revive charges a storage deposit per byte of deployed code.
optimizer_runs = 1
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./test" }]
