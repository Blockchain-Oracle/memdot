name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: The OpenAPI document and the SDK's types match the API
        env:
          # Only to satisfy the API's config parsing; nothing connects.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          BETTER_AUTH_SECRET: ci-only-placeholder-not-a-secret-value
          MEMORY_SECRET: ci-only-placeholder-not-a-secret-value
        run: |
          pnpm --filter @memdot/api openapi
          git diff --exit-code packages/sdk/openapi.json
          pnpm --filter @memdot/sdk generate:check
      - run: pnpm test
      - name: Every agent plugin matches its source and what its host accepts
        run: pnpm --filter @memdot/agent-plugin-core conformance
      - name: The CLI reference in the skills matches the CLI
        run: node scripts/skills-cli-reference.mjs --check
      - name: The Zapier app is valid
        working-directory: integrations/zapier-memdot
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx zapier-platform validate --without-style

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Lint and test the SDK, sealing fresh vectors
        working-directory: python/memdot
        env:
          MEMDOT_WRITE_VECTORS: "1"
        run: |
          uv sync --locked --extra local --extra mcp
          uv run ruff check .
          uv run ruff format --check .
          uv run python scripts/unasync.py --check
          uv run pytest
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript opens what Python just sealed
        run: pnpm turbo run test --filter=@memdot/sdk

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: forge test
