name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: The OpenAPI document and the SDK's types match the API
        env:
          # Only to satisfy the API's config parsing; nothing connects.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          BETTER_AUTH_SECRET: ci-only-placeholder-not-a-secret-value
        run: |
          pnpm --filter @memdot/api openapi
          git diff --exit-code packages/sdk/openapi.json
          pnpm --filter @memdot/sdk generate:check
      - run: pnpm test

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: forge test
