# Local development database: Postgres 18 with pgvector.
name: memdot
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: memdot
      POSTGRES_PASSWORD: memdot
      POSTGRES_DB: memdot
    ports:
      - "5434:5432" # 5432: native Postgres, 5433: another local project
    volumes:
      - memdot-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memdot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  memdot-pg:
